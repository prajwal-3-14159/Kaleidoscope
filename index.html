<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="app.doc-title">Kaleidoscope — Infinite Fractal Explorer</title>
  <meta name="description" content="Kaleidoscope is a WebGL2 fractal explorer with ultra-deep zoom. Dive into the Mandelbrot set, Julia sets, Burning Ship and more with GPU acceleration, perturbation theory, smooth colouring and one-click exports.">
  <meta name="theme-color" content="#07070d">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='%230b0b16'/%3E%3Cg transform='translate(32 32)'%3E%3Cpath id='p' d='M0 0 L-9 -26 Q0 -32 9 -26 Z' fill='%23a78bfa'/%3E%3Cuse href='%23p' transform='rotate(60)' opacity='.9'/%3E%3Cpath d='M0 0 L-9 -26 Q0 -32 9 -26 Z' fill='%2322d3ee' transform='rotate(120)'/%3E%3Cpath d='M0 0 L-9 -26 Q0 -32 9 -26 Z' fill='%23f472b6' transform='rotate(180)'/%3E%3Cpath d='M0 0 L-9 -26 Q0 -32 9 -26 Z' fill='%23fbbf24' transform='rotate(240)'/%3E%3Cpath d='M0 0 L-9 -26 Q0 -32 9 -26 Z' fill='%2334d399' transform='rotate(300)'/%3E%3Ccircle r='6' fill='%230b0b16'/%3E%3Ccircle r='3' fill='url(%23g)'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Full-bleed fractal surface -->
  <div id="stage">
    <canvas id="gl-canvas"></canvas>
    <canvas id="cpu-canvas" hidden></canvas>
  </div>

  <!-- Picture-in-picture Julia preview frame (interior is transparent; the canvas draws the image) -->
  <div id="pip" aria-hidden="true">
    <span class="pip-label" data-i18n="pip.hint"></span>
  </div>

  <!-- Brand + HUD -->
  <div class="topleft">
    <header class="brand">
      <h1 data-i18n="app.title">KALEIDOSCOPE</h1>
      <p class="subtitle" data-i18n="app.subtitle"></p>
    </header>

    <section id="hud" class="glass" aria-live="off">
      <div class="hud-row"><span class="hud-label" data-i18n="hud.fractal"></span><span class="hud-val" id="hud-fractal"></span></div>
      <div class="hud-row hud-row-center"><span class="hud-label" data-i18n="hud.center"></span><span class="hud-val hud-val-wrap" id="hud-center"></span></div>
      <div class="hud-row"><span class="hud-label" data-i18n="hud.zoom"></span><span class="hud-val" id="hud-zoom"></span></div>
      <div class="hud-row"><span class="hud-label" data-i18n="hud.iter"></span><span class="hud-val" id="hud-iter"></span></div>
      <div class="hud-row hud-row-mode"><span class="hud-label" data-i18n="hud.mode"></span><span class="hud-val" id="hud-mode"></span></div>
      <div class="hud-row"><span class="hud-label" data-i18n="hud.status"></span><span class="hud-val" id="hud-status"></span></div>
      <div class="track hud-track"><div class="track-bar" id="hud-progress"></div></div>
    </section>
  </div>

  <!-- Panel toggle -->
  <button id="btn-panel" class="icon-btn glass" type="button" data-i18n-aria="panel.toggle" data-i18n-title="panel.toggle" aria-controls="panel">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
    </svg>
  </button>

  <!-- Control panel -->
  <aside id="panel" class="glass" aria-label="Controls">
    <div class="panel-head">
      <span class="panel-title" data-i18n="panel.title"></span>
      <div class="panel-head-actions">
        <button id="btn-lang" class="text-btn" type="button" data-i18n="lang.switch">日本語</button>
        <button id="btn-help" class="icon-btn small" type="button" aria-label="Help" data-i18n-aria="help.title" data-i18n-title="help.title">?</button>
      </div>
    </div>

    <div class="panel-body">

      <!-- Fractal -->
      <details class="section" open>
        <summary data-i18n="sec.fractal"></summary>
        <div class="section-body">
          <div id="fractal-grid" class="fractal-grid"></div>

          <div class="switch-row" id="row-julia">
            <label for="toggle-julia" data-i18n="ctl.julia"></label>
            <input type="checkbox" id="toggle-julia" class="switch" role="switch">
          </div>

          <div id="julia-controls" class="sub-controls">
            <div class="field">
              <label for="julia-re" data-i18n="ctl.julia-re"></label>
              <div class="pair">
                <input type="range" id="julia-re" min="-2" max="2" step="0.0001">
                <input type="number" id="julia-re-num" step="0.0001" data-i18n-aria="ctl.julia-re">
              </div>
            </div>
            <div class="field">
              <label for="julia-im" data-i18n="ctl.julia-im"></label>
              <div class="pair">
                <input type="range" id="julia-im" min="-2" max="2" step="0.0001">
                <input type="number" id="julia-im-num" step="0.0001" data-i18n-aria="ctl.julia-im">
              </div>
            </div>
          </div>
          <p class="note tip" data-i18n="ctl.julia-tip"></p>
        </div>
      </details>

      <!-- Shape -->
      <details class="section" id="power-section" open>
        <summary data-i18n="sec.power"></summary>
        <div class="section-body">
          <div class="field">
            <label for="power" data-i18n="ctl.power"></label>
            <div class="pair">
              <input type="range" id="power" min="1.5" max="8" step="0.1">
              <input type="number" id="power-num" min="1.5" max="12" step="0.1" data-i18n-aria="ctl.power">
            </div>
          </div>
          <p id="power-note" class="note" data-i18n="ctl.power-note"></p>
        </div>
      </details>

      <!-- Colour -->
      <details class="section" open>
        <summary data-i18n="sec.color"></summary>
        <div class="section-body">
          <div id="palette-grid" class="palette-grid"></div>

          <div class="field">
            <label for="mapping" data-i18n="ctl.mapping"></label>
            <select id="mapping">
              <option value="sqrt" data-i18n="map.sqrt"></option>
              <option value="log" data-i18n="map.log"></option>
              <option value="linear" data-i18n="map.linear"></option>
            </select>
          </div>

          <div class="field">
            <div class="field-head">
              <label for="density" data-i18n="ctl.density"></label>
              <output class="badge" id="density-val" for="density"></output>
            </div>
            <input type="range" id="density" min="-3" max="3" step="0.01">
          </div>

          <div class="field">
            <label for="offset" data-i18n="ctl.offset"></label>
            <input type="range" id="offset" min="0" max="1" step="0.001">
          </div>

          <div class="switch-row">
            <label for="toggle-cycle" data-i18n="ctl.cycle"></label>
            <input type="checkbox" id="toggle-cycle" class="switch" role="switch">
          </div>
          <div class="field compact">
            <input type="range" id="cycle-speed" min="0.01" max="0.5" step="0.01" data-i18n-aria="ctl.cycle-speed" data-i18n-title="ctl.cycle-speed">
          </div>

          <div class="field">
            <span class="label" id="shading-label" data-i18n="ctl.shading"></span>
            <div class="seg-group" id="shading-seg" role="group" aria-labelledby="shading-label">
              <button type="button" class="seg" data-shading="flat" data-i18n="shade.flat"></button>
              <button type="button" class="seg" data-shading="filaments" data-i18n="shade.filaments"></button>
              <button type="button" class="seg" data-shading="relief" data-i18n="shade.relief"></button>
            </div>
          </div>

          <div class="field" id="light-row">
            <label for="light-angle" data-i18n="ctl.light"></label>
            <input type="range" id="light-angle" min="0" max="360" step="1">
          </div>

          <div class="field">
            <label for="interior" data-i18n="ctl.interior"></label>
            <select id="interior">
              <option value="black" data-i18n="interior.black"></option>
              <option value="glow" data-i18n="interior.glow"></option>
            </select>
          </div>
        </div>
      </details>

      <!-- Detail -->
      <details class="section" open>
        <summary data-i18n="sec.detail"></summary>
        <div class="section-body">
          <div class="switch-row">
            <label for="toggle-auto-iter" data-i18n="ctl.auto-iter"></label>
            <input type="checkbox" id="toggle-auto-iter" class="switch" role="switch">
          </div>

          <div class="field">
            <div class="field-head">
              <label for="iter" data-i18n="ctl.iter"></label>
              <output class="badge" id="iter-val" for="iter"></output>
            </div>
            <input type="range" id="iter" min="0" max="1000" step="1">
            <p class="note" data-i18n="ctl.iter-note"></p>
          </div>

          <div class="field">
            <label for="aa" data-i18n="ctl.aa"></label>
            <select id="aa">
              <option value="1">1×</option>
              <option value="4">4×</option>
              <option value="8">8×</option>
              <option value="16">16×</option>
            </select>
          </div>

          <div class="field">
            <div class="field-head">
              <label for="res" data-i18n="ctl.res"></label>
              <output class="badge" id="res-val" for="res"></output>
            </div>
            <input type="range" id="res" min="25" max="100" step="5">
            <p class="note" data-i18n="ctl.res-note"></p>
          </div>
        </div>
      </details>

      <!-- Engine -->
      <details class="section" open>
        <summary data-i18n="sec.engine"></summary>
        <div class="section-body">
          <div class="seg-group" id="engine-seg" role="group" data-i18n-aria="sec.engine">
            <button type="button" class="seg" data-engine="gpu" data-i18n="engine.gpu"></button>
            <button type="button" class="seg" data-engine="cpu" data-i18n="engine.cpu"></button>
          </div>
          <p class="note" id="engine-note"></p>
        </div>
      </details>

      <!-- Explore -->
      <details class="section" open>
        <summary data-i18n="sec.explore"></summary>
        <div class="section-body">
          <div class="row-2 row-tour">
            <select id="tour" data-i18n-aria="ctl.tour"></select>
            <button type="button" id="btn-tour-go" class="btn" data-i18n="btn.fly"></button>
          </div>

          <div class="row-2 even">
            <button type="button" id="btn-reset" class="btn" data-i18n="btn.reset"></button>
            <button type="button" id="btn-share" class="btn" data-i18n="btn.share"></button>
          </div>

          <div class="row-2 row-export">
            <select id="export-scale" data-i18n-aria="ctl.export-scale">
              <option value="1">1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select>
            <button type="button" id="btn-export" class="btn btn-primary" data-i18n="btn.export"></button>
          </div>

          <button type="button" id="btn-benchmark" class="btn btn-block" data-i18n="btn.benchmark"></button>
        </div>
      </details>

    </div>

    <footer class="panel-foot" data-i18n="panel.footer"></footer>
  </aside>

  <!-- Hint + toast -->
  <div id="hint" class="glass" data-i18n="hint.controls"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Benchmark running overlay -->
  <div id="bench-overlay" class="glass" role="status" aria-live="off">
    <div class="bench-top">
      <span class="bench-scene" id="bench-scene"></span>
      <button type="button" id="btn-bench-abort" class="btn btn-danger small" data-i18n="bench.abort"></button>
    </div>
    <div class="bench-stats">
      <div class="bench-stat"><span class="stat-label" data-i18n="bench.fps"></span><span class="stat-val" id="bench-fps"></span></div>
      <div class="bench-stat"><span class="stat-label" data-i18n="bench.elapsed"></span><span class="stat-val" id="bench-elapsed"></span></div>
    </div>
    <div class="track"><div class="track-bar" id="bench-progress-bar"></div></div>
  </div>

  <!-- Benchmark dialog -->
  <dialog id="bench-dialog" aria-labelledby="bench-title">
    <div class="dlg">
      <h2 class="dlg-title" id="bench-title" data-i18n="bench.title"></h2>

      <section id="bench-start">
        <p class="dlg-desc" data-i18n="bench.desc"></p>

        <div class="radio-cards">
          <label class="radio-card">
            <input type="radio" name="bench-mode" value="quick" checked>
            <span class="rc-body">
              <span class="rc-title" data-i18n="bench.quick"></span>
              <span class="rc-desc" data-i18n="bench.quick-desc"></span>
            </span>
          </label>
          <label class="radio-card">
            <input type="radio" name="bench-mode" value="full">
            <span class="rc-body">
              <span class="rc-title" data-i18n="bench.full"></span>
              <span class="rc-desc" data-i18n="bench.full-desc"></span>
            </span>
          </label>
        </div>

        <button type="button" id="btn-bench-run" class="btn btn-primary btn-block big" data-i18n="bench.run"></button>

        <h3 class="dlg-sub" data-i18n="bench.history"></h3>
        <ul id="bench-history" class="history"></ul>
      </section>

      <section id="bench-results" class="hidden">
        <div class="score-block">
          <span class="score-label" data-i18n="bench.score"></span>
          <span class="score-num" id="bench-score"></span>
        </div>
        <table class="bench-table">
          <thead>
            <tr>
              <th scope="col" data-i18n="bench.col-scene"></th>
              <th scope="col" class="num" data-i18n="bench.col-fps"></th>
              <th scope="col" class="num" data-i18n="bench.col-time"></th>
            </tr>
          </thead>
          <tbody id="bench-table"></tbody>
        </table>
        <p id="bench-meta" class="note"></p>
        <div class="row-2 even">
          <button type="button" id="btn-bench-copy" class="btn" data-i18n="bench.copy"></button>
          <button type="button" id="btn-bench-again" class="btn btn-primary" data-i18n="bench.again"></button>
        </div>
      </section>

      <div class="dlg-foot">
        <button type="button" id="btn-bench-close" class="btn" data-i18n="bench.close"></button>
      </div>
    </div>
  </dialog>

  <!-- Help dialog -->
  <dialog id="help-dialog" aria-labelledby="help-title">
    <div class="dlg">
      <h2 class="dlg-title" id="help-title" data-i18n="help.title"></h2>
      <dl class="keys">
        <div class="key-row"><dt><kbd data-i18n="help.k.drag"></kbd></dt><dd data-i18n="help.drag"></dd></div>
        <div class="key-row"><dt><kbd data-i18n="help.k.wheel"></kbd></dt><dd data-i18n="help.wheel"></dd></div>
        <div class="key-row"><dt><kbd data-i18n="help.k.dblclick"></kbd></dt><dd data-i18n="help.dblclick"></dd></div>
        <div class="key-row"><dt><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></dt><dd data-i18n="help.arrows"></dd></div>
        <div class="key-row"><dt><kbd>+</kbd><kbd>−</kbd></dt><dd data-i18n="help.zoomkeys"></dd></div>
        <div class="key-row"><dt><kbd>R</kbd></dt><dd data-i18n="help.reset"></dd></div>
        <div class="key-row"><dt><kbd>J</kbd></dt><dd data-i18n="help.julia"></dd></div>
        <div class="key-row"><dt><kbd>C</kbd></dt><dd data-i18n="help.cycle"></dd></div>
        <div class="key-row"><dt><kbd>H</kbd></dt><dd data-i18n="help.hide"></dd></div>
        <div class="key-row"><dt><kbd>F</kbd></dt><dd data-i18n="help.fullscreen"></dd></div>
        <div class="key-row"><dt><kbd>P</kbd></dt><dd data-i18n="help.panel"></dd></div>
        <div class="key-row"><dt><kbd>?</kbd></dt><dd data-i18n="help.help"></dd></div>
        <div class="key-row"><dt><kbd>Esc</kbd></dt><dd data-i18n="help.esc"></dd></div>
      </dl>
      <div class="dlg-foot">
        <button type="button" id="btn-help-close" class="btn" data-i18n="help.close"></button>
      </div>
    </div>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
